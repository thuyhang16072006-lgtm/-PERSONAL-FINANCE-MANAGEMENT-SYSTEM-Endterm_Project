                      setNewBank(a.BankName);
                      setShowForm(true);
                    }}
                    style={{ background: 'rgba(255,255,255,.2)', border: 'none', borderRadius: 6, padding: '4px 8px', color: '#fff', fontSize: 11, cursor: 'pointer' }}>
                    ✏️ Sửa
                  </button>
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 6 }}>
                  <span style={{ fontSize: 9.5, opacity: .65 }}>ID #{a.AccountID}</span>
                  <span style={{ fontSize: 9.5, opacity: .65, background: 'rgba(255,255,255,.2)', padding: '2px 8px', borderRadius: 20 }}>
                    {selAcc === a.AccountID ? 'Đang lọc ✓' : 'Lọc GD'}
                  </span>
                </div>
              </div>
            ))}
          </div>

          {/* Lịch sử giao dịch */}
          <div className="card">
            <div className="card-hd">
              <span className="card-t">{selAcc ? `Tài khoản #${selAcc}` : 'Tất cả giao dịch'}</span>
              {selAcc && <span className="link" onClick={() => setSelAcc(null)}>Bỏ lọc</span>}
            </div>
            {load ? <div className="loader"><div className="spin" /></div> : (
              <>
                {filteredHist.length === 0 && <div className="empty"><div className="empty-ico">📭</div>Không có giao dịch</div>}
                <div className="txl">
                  {filteredHist.slice(0, 20).map((tx, i) => (
                    <div key={i} className="txi">
                      <div className="txicon" style={{ background: tx.type === 'inc' ? '#e6f7ec' : '#fef2f2' }}>
                        {CAT_EMOJI[tx.cat] || '💳'}
                      </div>
                      <div className="tinfo">
                        <div className="tdesc">{tx.desc || tx.cat}</div>
                        <div className="tmeta">{tx.cat} · {tx.date} · {tx.BankName || '—'}</div>
                      </div>
                      <div className={`tamt ${tx.type === 'inc' ? 'inc' : 'expc'}`}>
                        {tx.type === 'inc' ? '+' : '-'}{fmtShort(tx.Amount)}
                      </div>
                    </div>
                  ))}
                </div>
                {filteredHist.length > 20 && (
                  <div style={{ textAlign: 'center', fontSize: 11.5, color: 'var(--txt3)', paddingTop: 10 }}>
                    Còn {filteredHist.length - 20} giao dịch khác
                  </div>
                )}
              </>
            )}
          </div>

          {/* Thống kê tháng */}
          <div className="card">
            <div className="card-hd"><span className="card-t">Thống kê tháng</span></div>
            <div className="sum3" style={{ padding: '6px 0' }}>
              <div className="sum3-item">
                <div className="sum3-lbl">Thu vào</div>
                <div className="sum3-val inc">{fmtShort(filteredHist.filter(t => t.type === 'inc').reduce((s, t) => s + Number(t.Amount), 0))}</div>
              </div>
              <div className="sum3-item">
                <div className="sum3-lbl">Chi ra</div>
                <div className="sum3-val expc">{fmtShort(filteredHist.filter(t => t.type === 'exp').reduce((s, t) => s + Number(t.Amount), 0))}</div>
              </div>
              <div className="sum3-item">
                <div className="sum3-lbl">Giao dịch</div>
                <div className="sum3-val">{filteredHist.length}</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ── APP SHELL ── */
    const NAVS = [
      { lbl: 'Tổng quan', svg: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z" /><path d="M9 21V12h6v9" /></svg> },
      { lbl: 'Giao dịch', svg: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="8" y1="6" x2="21" y2="6" /><line x1="8" y1="12" x2="21" y2="12" /><line x1="8" y1="18" x2="21" y2="18" /><circle cx="3" cy="6" r="1" fill="currentColor" /><circle cx="3" cy="12" r="1" fill="currentColor" /><circle cx="3" cy="18" r="1" fill="currentColor" /></svg> },
      { lbl: 'Nhập liệu', svg: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9" /><line x1="12" y1="8" x2="12" y2="16" /><line x1="8" y1="12" x2="16" y2="12" /></svg> },
      { lbl: 'Ngân sách', svg: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="3" width="20" height="14" rx="2" /><path d="M8 21h8m-4-4v4" /><path d="M7 10h2m2 0h2m2 0h2" /></svg> },
      { lbl: 'Ví của tôi', svg: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="2" y="5" width="20" height="14" rx="2" /><path d="M2 10h20" /><circle cx="16" cy="15" r="1" fill="currentColor" /></svg> },
    ];

    // ── Component Auth (Đăng nhập + Đăng ký) ──
    function AuthPage({ onLogin }) {
      const [tab, setTab] = useState('login'); // 'login' | 'register'

      // Trạng thái đăng nhập
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPw, setLoginPw] = useState('');
      const [loginLoading, setLoginLoading] = useState(false);
      const [loginErr, setLoginErr] = useState('');

      // Trạng thái đăng ký
      const [regName, setRegName] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regPhone, setRegPhone] = useState('');
      const [regPw, setRegPw] = useState('');
      const [regPw2, setRegPw2] = useState('');
      const [regLoading, setRegLoading] = useState(false);
      const [regErr, setRegErr] = useState('');
      const [regOk, setRegOk] = useState('');

      const handleLogin = async () => {
        setLoginErr('');
        if (!loginEmail.trim()) { setLoginErr('Vui lòng nhập Email'); return; }
        if (!loginPw) { setLoginErr('Vui lòng nhập mật khẩu'); return; }
        setLoginLoading(true);
        const res = await api('/login', {
          method: 'POST',
          body: JSON.stringify({ email: loginEmail.trim(), password: loginPw })
        });
        setLoginLoading(false);
        if (isErr(res)) {
          setLoginErr(res.detail || 'Đăng nhập thất bại — kiểm tra email / mật khẩu');
        } else {
          onLogin(res);
        }
      };

      const handleRegister = async () => {
        setRegErr(''); setRegOk('');
        if (!regName.trim()) { setRegErr('Vui lòng nhập họ tên'); return; }
        if (!regEmail.trim() || !regEmail.includes('@')) { setRegErr('Email không hợp lệ'); return; }
        if (regPw.length < 6) { setRegErr('Mật khẩu tối thiểu 6 ký tự'); return; }
        if (regPw !== regPw2) { setRegErr('Mật khẩu xác nhận không khớp'); return; }
        setRegLoading(true);
        const res = await api('/register', {
          method: 'POST',
          body: JSON.stringify({ username: regName.trim(), email: regEmail.trim(), phone: regPhone.trim(), password: regPw })
        });
        setRegLoading(false);
        if (isErr(res)) {
          setRegErr(res.detail || 'Đăng ký thất bại');
        } else {
          setRegOk('🎉 Đăng ký thành công! Hãy đăng nhập ngay.');
          setRegName(''); setRegEmail(''); setRegPhone(''); setRegPw(''); setRegPw2('');
          setTimeout(() => { setTab('login'); setLoginEmail(regEmail.trim()); setRegOk(''); }, 1800);
        }
      };

      const inputStyle = { width: '100%', padding: '10px 13px', border: '1.5px solid var(--border)', borderRadius: 10, fontSize: 13.5, background: '#fbfdfc', color: 'var(--txt)', outline: 'none', marginBottom: 10, boxSizing: 'border-box' };
      const errStyle = { background: '#fff0f0', border: '1px solid #fecaca', borderRadius: 8, padding: '8px 12px', fontSize: 12, color: '#991b1b', marginBottom: 12 };
      const okStyle = { background: '#f0fdf4', border: '1px solid #bbf7d0', borderRadius: 8, padding: '8px 12px', fontSize: 12, color: '#166534', marginBottom: 12 };

      return (
        <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: '20px 16px', background: 'linear-gradient(145deg, #123d30 0%, #25694e 55%, #47a371 100%)' }}>

          {/* Logo */}
          <div style={{ textAlign: 'center', marginBottom: 24 }}>
            <div style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 26, fontWeight: 800, color: '#fff', marginBottom: 4 }}>
              <div style={{ width: 9, height: 9, background: '#fff', borderRadius: '50%', opacity: .6 }} />MoneyMate
            </div>
            <div style={{ fontSize: 12, color: 'rgba(255,255,255,.65)' }}>Quản lý tài chính cá nhân</div>
          </div>

          {/* Card */}
          <div style={{ background: '#fff', borderRadius: 20, padding: '24px 20px', boxShadow: '0 24px 60px rgba(0,0,0,.25)', maxWidth: 400, margin: '0 auto', width: '100%' }}>

            {/* Tab switcher */}
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6, marginBottom: 22, background: '#f3f7f5', borderRadius: 12, padding: 4 }}>
              {[['login', '🔑 Đăng nhập'], ['register', '✏️ Đăng ký']].map(([key, label]) => (
                <button key={key} onClick={() => { setTab(key); setLoginErr(''); setRegErr(''); setRegOk(''); }}
                  style={{ padding: '8px 6px', border: 'none', borderRadius: 9, fontSize: 12.5, fontWeight: 700, cursor: 'pointer', transition: 'all .2s',
                    background: tab === key ? '#fff' : 'transparent',
                    color: tab === key ? 'var(--G)' : 'var(--txt2)',
                    boxShadow: tab === key ? '0 2px 8px rgba(0,0,0,.08)' : 'none' }}>
                  {label}
                </button>
              ))}
            </div>

            {/* ── FORM ĐĂNG NHẬP ── */}
            {tab === 'login' && (
              <div>
                {loginErr && <div style={errStyle}>⚠️ {loginErr}</div>}
                <label style={{ fontSize: 10.5, color: 'var(--txt2)', fontWeight: 700, letterSpacing: .5, textTransform: 'uppercase', marginBottom: 5, display: 'block' }}>Email</label>
                <input style={inputStyle} type="email" placeholder="your@email.com"
                  value={loginEmail} onChange={e => setLoginEmail(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && handleLogin()} />
                <label style={{ fontSize: 10.5, color: 'var(--txt2)', fontWeight: 700, letterSpacing: .5, textTransform: 'uppercase', marginBottom: 5, display: 'block' }}>Mật khẩu</label>
                <input style={inputStyle} type="password" placeholder="••••••••"
                  value={loginPw} onChange={e => setLoginPw(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && handleLogin()} />
                <button className="sbtn" onClick={handleLogin} disabled={loginLoading} style={{ marginTop: 4 }}>
                  {loginLoading ? 'Đang xác thực...' : '🔑 Đăng nhập'}
                </button>
                <div style={{ textAlign: 'center', marginTop: 14, fontSize: 11.5, color: 'var(--txt3)' }}>
                  Chưa có tài khoản?{' '}
                  <span onClick={() => setTab('register')} style={{ color: 'var(--G)', fontWeight: 700, cursor: 'pointer' }}>Đăng ký ngay</span>
                </div>
              </div>
            )}

            {/* ── FORM ĐĂNG KÝ ── */}
            {tab === 'register' && (
              <div>
                {regErr && <div style={errStyle}>⚠️ {regErr}</div>}
                {regOk && <div style={okStyle}>{regOk}</div>}
                <label style={{ fontSize: 10.5, color: 'var(--txt2)', fontWeight: 700, letterSpacing: .5, textTransform: 'uppercase', marginBottom: 5, display: 'block' }}>Họ và tên *</label>
                <input style={inputStyle} type="text" placeholder="Nguyễn Văn An"
                  value={regName} onChange={e => setRegName(e.target.value)} />
                <label style={{ fontSize: 10.5, color: 'var(--txt2)', fontWeight: 700, letterSpacing: .5, textTransform: 'uppercase', marginBottom: 5, display: 'block' }}>Email *</label>
                <input style={inputStyle} type="email" placeholder="your@email.com"
                  value={regEmail} onChange={e => setRegEmail(e.target.value)} />
                <label style={{ fontSize: 10.5, color: 'var(--txt2)', fontWeight: 700, letterSpacing: .5, textTransform: 'uppercase', marginBottom: 5, display: 'block' }}>Số điện thoại <span style={{ fontWeight: 400, color: 'var(--txt3)' }}>(tuỳ chọn)</span></label>
                <input style={inputStyle} type="tel" placeholder="0901234567"
                  value={regPhone} onChange={e => setRegPhone(e.target.value)} />
                <label style={{ fontSize: 10.5, color: 'var(--txt2)', fontWeight: 700, letterSpacing: .5, textTransform: 'uppercase', marginBottom: 5, display: 'block' }}>Mật khẩu * <span style={{ fontWeight: 400, color: 'var(--txt3)' }}>(tối thiểu 6 ký tự)</span></label>
                <input style={inputStyle} type="password" placeholder="••••••••"
                  value={regPw} onChange={e => setRegPw(e.target.value)} />
                <label style={{ fontSize: 10.5, color: 'var(--txt2)', fontWeight: 700, letterSpacing: .5, textTransform: 'uppercase', marginBottom: 5, display: 'block' }}>Xác nhận mật khẩu *</label>
                <input style={inputStyle} type="password" placeholder="••••••••"
                  value={regPw2} onChange={e => setRegPw2(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && handleRegister()} />
                <button className="sbtn" onClick={handleRegister} disabled={regLoading} style={{ marginTop: 4 }}>
                  {regLoading ? 'Đang tạo tài khoản...' : '✏️ Tạo tài khoản'}
                </button>
                <div style={{ textAlign: 'center', marginTop: 14, fontSize: 11.5, color: 'var(--txt3)' }}>
                  Đã có tài khoản?{' '}
                  <span onClick={() => setTab('login')} style={{ color: 'var(--G)', fontWeight: 700, cursor: 'pointer' }}>Đăng nhập</span>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }
    // ── App Shell (đã cập nhật hỗ trợ multi-user) ──
    function App() {
      const [user, setUser] = useState(() => {
        try { return JSON.parse(localStorage.getItem('mm_user')); } catch { return null; }
      });
      const [page, setPage] = useState(0);
      const g = useGlobal();

      // Nếu chưa đăng nhập → hiện trang Login
      if (!user) {
        return <AuthPage onLogin={(u) => {
          localStorage.setItem('mm_user', JSON.stringify(u));
          window.UID = u.UserID;
          setUser(u);
        }} />;
      }

      // Gán UID động theo user đăng nhập
      window.UID = user.UserID;

      const handleLogout = () => {
        localStorage.removeItem('mm_user');
        window.UID = null;
        setUser(null);
      };

      useEffect(() => {
        if (!window.UID) return;
        api(`/accounts/${window.UID}`).then(a => g.setTotalBal((!isErr(a) && a?.total) ? a.total : 0));
      }, [g.refresh, user]);

      const pages = [
        <HomePage g={g} onNav={setPage} />,
        <TxPage g={g} />,
        <AddPage g={g} />,
        <BudgetPage g={g} />,
        <AccountPage g={g} />,
      ];

      return (
        <div className="shell">
          <div className="hdr">
            <div className="hdr-top">
              <div className="logo"><div className="logo-dot" />MoneyMate</div>
              <div className="hdr-right">
                <button onClick={handleLogout} style={{ background: 'rgba(255,255,255,0.2)', border: 'none', color: '#fff', padding: '4px 10px', borderRadius: 8, fontSize: 11, cursor: 'pointer', fontWeight: 600, marginBottom: 4 }}>
                  Đăng xuất
                </button>
                <div className="hdr-lbl">Tổng tài sản</div>
                <div className="hdr-bal">{fmt(g.totalBal)}</div>
              </div>
            </div>
            <div className="hdr-greet">Xin chào, {user.UserName} 👋 — {new Date().toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'numeric' })}</div>
          </div>
          <div style={{ flex: 1, overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
            {pages[page]}
          </div>
          <div className="bnav">
            {NAVS.map((n, i) => (
              <button key={i} className={`nb ${page === i ? 'on' : ''}`} onClick={() => setPage(i)}>
                {n.svg}<span>{n.lbl}</span>
              </button>
            ))}
          </div>
          {g.toast && <Toast msg={g.toast} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
